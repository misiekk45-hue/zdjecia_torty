<style>
    :root {
        --primary-pink: #ffb6c1; /* Jasny róż */
        --dark-pink: #ff69b4;    /* Mocniejszy róż do detali */
        --bg-color: #fff5f7;     /* Tło strony */
        --card-bg: #ffffff;
    }

    body { 
        font-family: 'Segoe UI', Roboto, sans-serif; 
        background-color: var(--bg-color); 
        margin: 0; 
        padding-bottom: 20px;
        color: #444;
        overflow-x: hidden;
    }

    /* --- NAGŁÓWEK --- */
    .header {
        position: sticky;
        top: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 10px 15px;
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(255, 182, 193, 0.2);
        border-bottom: 2px solid var(--primary-pink);
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .logo {
        height: 80px; /* Rozmiar dopasowany do linii wyszukiwarki */
        width: auto;
        object-fit: contain;
        flex-shrink: 0;
        cursor: pointer;
    }

    .search-container {
        flex-grow: 1;
        position: relative;
    }

    /* Ikona lupy wewnątrz pola */
    .search-container::before {
        content: '🔍';
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 18px;
        z-index: 5;
        pointer-events: none;
    }

    #search { 
        width: 100%; 
        padding: 12px 15px 12px 45px; /* Duży lewy padding dla lupy */
        border-radius: 30px; 
        border: 2px solid var(--primary-pink); 
        font-size: 16px; 
        outline: none;
        transition: 0.3s;
        box-sizing: border-box;
    }

    #search:focus {
        border-color: var(--dark-pink);
        box-shadow: 0 0 10px rgba(255, 105, 180, 0.2);
    }

    #results-count {
        font-size: 11px;
        color: var(--dark-pink);
        margin-top: 4px;
        position: absolute;
        width: 100%;
        text-align: center;
    }

    /* --- GALERIA --- */
    .gallery { 
        display: grid; 
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
        gap: 12px; 
        padding: 20px 15px;
        max-width: 1200px;
        margin: 0 auto;
    }

    .card { 
        background: var(--card-bg); 
        aspect-ratio: 1 / 1; 
        overflow: hidden; 
        border-radius: 18px; 
        cursor: pointer; 
        transition: all 0.3s ease;
        box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        border: 1px solid rgba(255, 182, 193, 0.2);
        animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 20px rgba(255, 182, 193, 0.4);
    }

    .card img { 
        width: 100%; 
        height: 100%; 
        object-fit: cover; 
        transition: transform 0.5s ease;
    }

    .card:hover img {
        transform: scale(1.1);
    }

    /* --- OKNO POWIĘKSZENIA (MODAL) --- */
    #modal { 
        display: none; 
        position: fixed; 
        top: 0; left: 0; 
        width: 100%; height: 100%; 
        background: #fff; 
        z-index: 9999; 
        overflow-y: auto;
    }

    .modal-nav {
        position: sticky;
        top: 0;
        background: #fff;
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eee;
    }

    .close-btn { 
        font-size: 35px; 
        color: var(--dark-pink); 
        cursor: pointer; 
        line-height: 1;
    }

    #modalImg { 
        width: 100%; 
        max-height: 60vh; 
        object-fit: contain; 
        background: #fafafa;
    }

    .modal-info { padding: 30px; text-align: center; }
    
    .modal-desc { 
        font-size: 18px; 
        font-weight: 500;
        margin-bottom: 25px;
        color: #444;
    }

    .share-btn { 
        background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
        color: white; 
        padding: 16px 40px; 
        border-radius: 50px; 
        border: none; 
        font-size: 16px; 
        font-weight: bold;
        box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        cursor: pointer;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.03); }
        100% { transform: scale(1); }
    }
</style>

<div id="modal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <img id="modalImg" src="">
    <div class="modal-content">
        <p id="modalDesc" style="font-weight: bold; font-size: 18px;"></p> <button class="btn" id="shareBtn">Udostępnij zdjęcie</button>
    </div>
</div>

<script>
    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function filter() {
        const val = document.getElementById('search').value.toLowerCase();
        const cards = document.getElementsByClassName('card');
        let count = 0;
        for (let i = 0; i < cards.length; i++) {
            const tags = cards[i].getAttribute('data-tags').toLowerCase();
            if (tags.includes(val)) {
                cards[i].style.display = "block";
                count++;
            } else {
                cards[i].style.display = "none";
            }
        }
        document.getElementById('results-count').innerText = val ? "Znaleziono: " + count : "";
    }

    // GŁÓWNA OBSŁUGA KLIKNIĘCIA
    document.addEventListener('click', function (e) {
        const card = e.target.closest('.card');
        if (card) {
            console.log("Kliknięto kartę!"); // Test w konsoli
            const img = card.querySelector('img');
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modalImg');
            const modalDesc = document.getElementById('modalDesc');

            if (modal && modalImg) {
                modalImg.src = img.src;
                modalDesc.innerText = card.getAttribute('data-tags');
                modal.style.display = 'block';
                document.body.style.overflow = 'hidden';
            } else {
                alert("Błąd: Nie znaleziono okna Modal w kodzie!");
            }
        }
    });

    // Udostępnianie
    document.getElementById('shareBtn').onclick = function() {
        const imgSrc = document.getElementById('modalImg').src;
        const text = document.getElementById('modalDesc').innerText;
        if (navigator.share) {
            navigator.share({ title: 'Tort', text: text, url: imgSrc });
        } else {
            window.open('https://wa.me/?text=' + encodeURIComponent(text + " " + imgSrc));
        }
    };
</script>
